<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070a10">
<meta name="description" content="madobe（窓辺）— 天気と時間帯の生きたシーンを眺める、ブラウザで動く作業用の背景映像。">
<title>madobe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #070a10;
    --ink: #d9dde6;
    --ink-dim: #7f8797;
    --accent: #ffd28a;
    --panel: rgba(10, 14, 22, 0.72);
    --line: rgba(217, 221, 230, 0.16);
    --serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
  }

  /* ---- stage ---- */
  #stage { position: fixed; inset: 0; background: var(--bg); }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .notice {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    text-align: center;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.9;
    color: var(--ink-dim);
    pointer-events: none;
  }

  /* ---- top: logo + tabs ---- */
  .top {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: calc(12px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) 18px calc(16px + env(safe-area-inset-left, 0px));
    background: linear-gradient(rgba(5, 7, 12, 0.7), rgba(5, 7, 12, 0));
    pointer-events: none;
    transition: opacity 0.45s ease;
  }
  .logo {
    flex: none;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.32em;
    color: var(--ink-dim);
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.6);
  }
  .tabs {
    display: flex;
    gap: 2px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    pointer-events: auto;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs a {
    flex: none;
    padding: 6px 10px;
    font-size: 14px;
    letter-spacing: 0.12em;
    color: rgba(217, 221, 230, 0.72);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.6);
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .tabs a:hover { color: var(--ink); }
  .tabs a[aria-current="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- bottom: title + panel ---- */
  .hud {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 48px calc(16px + env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
    background: linear-gradient(to top, rgba(5, 7, 12, 0.45), rgba(5, 7, 12, 0));
    pointer-events: none;
    transition: opacity 0.45s ease;
  }
  .title { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .title h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-wrap: balance;
    text-shadow: 0 2px 18px rgba(0, 0, 0, 0.8);
  }
  .title p {
    margin: 0;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--ink-dim);
    text-transform: uppercase;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.8);
  }

  .panel {
    pointer-events: auto;
    box-sizing: border-box;
    width: 320px;
    max-width: 100%;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-family: var(--mono);
    font-size: 12px;
  }
  .params {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 8px 12px;
    align-items: center;
  }
  .params:empty { display: none; }
  .params label { color: var(--ink-dim); letter-spacing: 0.06em; white-space: nowrap; }
  .params output { font-variant-numeric: tabular-nums; min-width: 4ch; text-align: right; color: var(--ink); }
  .params input[type="range"] { width: 100%; min-width: 0; margin: 0; height: 20px; accent-color: var(--accent); }
  .params input[type="range"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actions button {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 7px 10px;
    font: inherit;
    letter-spacing: 0.08em;
    cursor: pointer;
  }
  .actions button:hover { border-color: var(--accent); color: var(--accent); }
  .actions button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- hidden UI ---- */
  body.hidden-ui .top,
  body.hidden-ui .hud { opacity: 0; }
  body.hidden-ui .top *,
  body.hidden-ui .hud * { pointer-events: none; }

  /* ---- phone ---- */
  @media (max-width: 480px) {
    .logo { display: none; }
    .top { gap: 0; }
    .hud { flex-direction: column; align-items: stretch; gap: 12px; }
    .title h1 { font-size: 22px; }
    .panel { width: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    .top, .hud, .tabs a { transition: none; }
  }
</style>
</head>
<body>

<div id="stage"></div>

<header class="top">
  <span class="logo">madobe</span>
  <nav class="tabs" id="tabs" aria-label="シーン"></nav>
</header>

<div class="hud">
  <div class="title">
    <h1 id="scene-name">&nbsp;</h1>
    <p id="scene-meta"></p>
  </div>
  <form class="panel" id="controls" aria-label="シーンの設定">
    <div class="params" id="params"></div>
    <div class="actions">
      <button type="button" id="hide-ui">UIを隠す</button>
      <button type="button" id="fullscreen">全画面</button>
    </div>
  </form>
</div>

<noscript><div class="notice">madobe の表示には JavaScript が必要です。</div></noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="src/app.js"></script>
<!-- scenes: src/scenes/ にファイルを置いたら、ここに1行足す -->
<script src="src/scenes/night-rain.js"></script>
<script src="src/scenes/dusk-rain.js"></script>
</body>
</html>
